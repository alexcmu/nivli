services:
  api:
    environment:
      MODEL_API_KEY_FILE: /run/secrets/model_api_key
      MODEL_ID: ${MODEL_ID:-claude-sonnet-5-5}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.anthropic.com}
    secrets: [admin_secret, model_api_key]
  agent:
    environment:
      MODEL_API_KEY_FILE: /run/secrets/model_api_key
      MODEL_ID: ${MODEL_ID:-claude-sonnet-5-5}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.anthropic.com}
    secrets: [admin_secret, model_api_key]
secrets:
  model_api_key:
    file: ${MODEL_API_KEY_PATH:?Set MODEL_API_KEY_PATH to a server-only Anthropic API key file}

const notes={home:['主界面','只看此刻值得关注的事。','明确的交代拥有完成按钮。尚未确认的发现单独成组，用结构区分两者，避免让 AI 替用户作出承诺。','试试：完成“提交材料”，然后撤销；或者打开建议看看来源。'],chat:['自然输入','一句交代，一个清楚的结果。','聊天不只是回复“好的”。每次创建都展示任务、时间和提醒状态，用户可以立即修正。','试试预置的浇水提醒。此演示使用有限规则，其他文本会进入手动确认。'],detail:['事项详情','知道为什么，也能改主意。','把提醒时间与截止时间分开。来源与原因就在动作附近，不需要翻长篇聊天记录。','试试：修改提醒时间，或稍后 30 分钟。操作会同步到首页的演示状态。'],suggestion:['主动发现','先征求意见，再设为提醒。','一句建议、一段依据、一个决定。确认前不会进入正式事项，也不会悄悄改变已有承诺。','试试：设为提醒并选时间；或选择“不用了”，再撤销。'],settings:['隐私与控制','它知道什么，你看得见。','记忆、信息来源、提醒方式都可以检查。环境信息收进二级页，日常使用不需要理解后端。','试试：查看记忆、修改安静时段，或者切换锁屏隐私。'],connect:['首次使用','先连接自己的环境。','配对只索取服务地址和一次性配对码。先说明数据会去哪里，再引导创建第一条提醒。','这里演示连接步骤，不发起网络请求。邮箱与位置权限在需要时再申请。'],empty:['空状态','没事的时候，就安静一点。','不用完成率、连续打卡或推荐内容填满页面。一个简短说明，一个自然的交代入口。','这是独立的空状态样本，不会清空其他场景中的演示数据。'],offline:['异常状态','说清哪里成功，哪里还在等。','本机已经安排的提醒继续保留。后续修改明确标记待同步，不用一个“离线”图标掩盖所有状态。','这里演示网络异常；已有时间提醒与新同步状态分别表达。']};
const state={scene:'home',done:false,time:'今天 10:00',suggestion:'pending',created:[],preview:false,quiet:'22:00–08:00',frequency:'仅应用内',connected:false,locationTime:'',mail:true,memory:true,chatSent:false,chatResult:'',chatTime:''};
let toastTimer;let lastFocus;
const $=s=>document.querySelector(s);const action=(name,label,cls='text-button',extra='')=>`<button class="${cls}" data-action="${name}" ${extra}>${label}</button>`;
function row(name,title,sub,act,value=''){return `<button class="list-row" data-action="${act}"><span class="row-icon">${icon(name)}</span><span><span class="row-title">${title}</span>${sub?`<span class="row-sub">${sub}</span>`:''}</span>${value?`<span class="value">${value}</span>`:''}${icon('arrow').replace('<svg','<svg class="chevron"')}</button>`}
function focusCard(){return !state.done?`<article class="focus-card"><div class="time-label">${icon('now')}${esc(state.time)}</div><div class="task-line"><button class="task-name" data-action="detail">提交材料</button><button class="complete-btn" data-action="complete" aria-label="完成提交材料"><span></span></button></div><p class="card-note">今天 18:00 截止 · 你交代的事</p><div class="mini-foot"><span>${state.scene==='offline'?'本机提醒已安排':'本机提醒已安排'}</span>${action('snooze','稍后提醒')}</div></article>`:`<div class="offline">${icon('check')} 提交材料已完成。${action('undo','撤销完成')}</div>`}
function home(){return `<p class="eyebrow">10 月 10 日，星期六</p><div class="page-top"><h2>此刻</h2>${action('all','全部')}</div><p class="subtle" style="margin:0">${state.done?'接下来的事，已经记着了。':'先把眼前这件事处理好。'}</p>${state.scene==='offline'?'<div class="offline"><strong>暂时无法连接你的环境</strong><br>本机已安排的提醒仍然保留。新修改将在恢复连接后同步。'+action('retry','重试连接')+'</div>':''}${focusCard()}<div class="section-head"><h3>稍后</h3><span>按约定提醒</span></div>${row(state.locationTime?'now':'pin','带上移动硬盘',state.locationTime||'离开家附近时','location')}${row('now','给相机充电','今天 20:00','camera')}${state.created.map(t=>row('doc',esc(t.title),esc(t.when),'created', '')).join('')}${state.suggestion==='pending'?`<div class="section-head"><h3>待你确认</h3><span>1 个建议</span></div><article class="suggestion"><div class="suggestion-label">${icon('mail')}${state.mail?'来自你连接的邮箱':'来源已断开 · 内容可能过时'}</div><p>这封邮件似乎需要你在周五前补交材料。</p>${action('suggestion','看看这封邮件')}</article>`:''}`}
function chat(){return `<div class="page-top"><h2>交代</h2></div><p class="subtle" style="margin:0">想到什么，告诉我。</p><div class="chat-date">今天</div><div class="bubble user">今天上午十点提醒我提交材料。</div><div class="assistant-line">${state.done?'这件事已经完成。':'记下了。到时候提醒你。'}</div><div class="receipt"><small>${icon('check')}${state.done?'已完成':'已设提醒'}</small><h3>提交材料</h3><p>${esc(state.time)}</p><p class="inline-note" style="margin-top:6px">${state.done?'已停止后续提醒':'本机提醒已安排'}</p>${action('detail','查看事项')}</div>${state.chatSent?`<div class="bubble user">${esc(state.chatResult)}</div><div class="receipt"><small>${icon('check')}已设提醒 · 演示</small><h3>${esc(state.created.at(-1)?.title||'给绿植浇水')}</h3><p>${esc(state.chatTime)}</p>${action('created','查看新事项')}</div>`:`<button class="sample" data-action="sample">试着说：明天九点提醒我给绿植浇水</button>`}`}
function detail(){return `${action('home',icon('back')+'此刻','back')}<h2 class="detail-title">提交材料</h2><span class="tag">${icon(state.done?'check':'now')}${state.done?'已完成':'已设提醒'}</span><dl class="details"><div class="detail-row"><dt>提醒我</dt><dd>${action('edit',esc(state.time))}</dd></div><div class="detail-row"><dt>截止时间</dt><dd>今天 18:00</dd></div><div class="detail-row"><dt>提醒状态</dt><dd>${state.done?'已停止后续提醒':'本机已安排'}</dd></div></dl><div class="section-head"><h3>为什么提醒我</h3></div><p class="subtle">你希望在截止前留出时间，检查并提交申请材料。</p><div class="source"><small>来自你的交代 · 今天 08:32</small><p>“今天上午十点提醒我提交材料，下午六点截止。”</p></div>${state.done?action('undo','恢复为未完成','primary'):`<div class="button-pair">${action('complete','完成','solid')}${action('snooze','稍后提醒','')}</div>`}`}
function suggestion(){return `${action('home',icon('back')+'此刻','back')}<span class="tag" style="margin-top:21px">${icon('spark')}${state.suggestion==='pending'?'待你确认':state.suggestion==='accepted'?'已设为提醒':'已忽略'}</span><h2 class="detail-title">周五前，<br>可能需要补交材料。</h2><p class="subtle">这封邮件提到了截止时间。<br>需要我提前提醒你吗？</p><div class="source"><small>林老师 · 10 月 9 日 16:20</small><p style="font-weight:550">关于申请材料的补充说明</p><p>“请在下周五（10 月 16 日）前补交附件中的两份材料。”</p>${action('source','查看来源依据')}</div><p class="inline-note">${state.mail?'尚未替你安排，也不会发送邮件。':'来源已断开，内容可能过时。确认前请核对。'}</p>${state.suggestion==='pending'?`${action('accept','设为提醒','primary')}${action('dismiss','不用了','secondary')}`:`<div class="offline">${state.suggestion==='accepted'?'已添加到你的事项。':'这条建议已收起。'}${action('restore-suggestion','撤销')}</div>`}`}
function settings(){return `<div class="page-top"><h2>我的</h2></div><div class="profile"><div class="profile-mark">${icon('shield')}</div><div><strong>我的 Haiji</strong><p>个人环境 · 连接正常</p></div></div><div class="settings-group"><h3>它知道什么</h3>${row('leaf','个人记忆','','memory',state.memory?'2 条':'1 条')}${row('mail','信息来源','','mail',state.mail?'1 个邮箱':'未连接')}</div><div class="settings-group"><h3>如何提醒我</h3>${row('moon','安静时段','','quiet',esc(state.quiet))}${row('bell','建议频率','','frequency',esc(state.frequency))}${row('shield','锁屏预览','','privacy',state.preview?'显示详情':'隐藏详情')}</div><div class="settings-group"><h3>由你掌控</h3>${row('link','我的环境','','environment')}${row('doc','导出与删除','','data')}</div>`}
function connect(){return `<div class="onboarding"><div class="hero-mark">${icon('link')}</div><h2>连接你的 Haiji</h2><p class="subtle">使用自己的环境，<br>把交代的事留在自己手里。</p><label class="form-label" for="server">服务地址</label><input class="input" id="server" value="https://haiji.example.com" type="url" autocomplete="off"><label class="form-label" for="pair-code">一次性配对码</label><input class="input" id="pair-code" placeholder="从你的部署页面获取" value="482 916" inputmode="numeric" autocomplete="off"><p class="inline-note" style="margin:17px 0 25px">你的事项保存在此环境。若使用云端模型，相关内容也会发送给你配置的模型服务。</p>${action('pair','连接环境','primary')}<p class="inline-note" style="text-align:center;margin-top:16px">连接流程演示，不会访问填写的地址。</p></div>`}
function empty(){return `<div class="page-top"><h2>此刻</h2></div><div class="empty">${icon('empty')}<h3>暂时没有要处理的事。</h3><p>想到什么，随时交代。<br>需要的时候再提醒你。</p>${action('chat','交代一件事','text-button')}</div>`}
function render(){const s=state.scene;$('#scenes').innerHTML=scenes.map(([id,title,ic])=>`<button class="scene" data-scene="${id}" aria-current="${id===s}">${icon(ic)}${title}${id===s?'<span class="tick">·</span>':''}</button>`).join('');$('#screen').className='screen'+(s==='chat'?' chat-screen':'');$('#screen').innerHTML=({home,offline:home,chat,detail,suggestion,settings,connect,empty}[s])();$('#tabs').innerHTML=[['home','此刻','now'],['chat','交代','chat'],['settings','我的','user']].map(([id,title,ic])=>`<button data-scene="${id}" aria-selected="${id===s||id==='home'&&['detail','suggestion','offline','empty'].includes(s)}">${icon(ic)}${title}</button>`).join('');$('#tabs').style.display=s==='connect'?'none':'flex';$('#chat-form').hidden=s!=='chat';$('#chat-form').style.display=s==='chat'?'flex':'none';const n=notes[s];$('#note-label').textContent=n[0];$('#note-title').textContent=n[1];$('#note-body').textContent=n[2];$('#note-action').textContent=n[3];renderPush()}
function renderPush(){const visible=state.preview;$('#preview').checked=visible;$('#push').innerHTML=`<div class="push-top">${icon('bell')}Haiji<time>现在</time></div><h4>${state.done?'这件事已完成':visible?'提交材料':'你有一件待处理的事'}</h4><p>${state.done?'已停止后续提醒。':visible?'今天 18:00 截止，可以先检查附件。':'解锁后查看详情。'}</p><div class="push-actions">${state.done?action('home','查看事项',''):visible?`${action('complete','完成','')}${action('push-snooze','30 分钟后','')}`:action('unlock','解锁查看','')}</div>`}
function go(s){state.scene=s;$('#toast').hidden=true;render();$('#screen').scrollTop=0}
function toast(msg,undo){clearTimeout(toastTimer);$('#toast').innerHTML=`<span>${esc(msg)}</span>${undo?`<button data-action="${undo}">撤销</button>`:''}`;$('#toast').hidden=false;if(!undo)toastTimer=setTimeout(()=>$('#toast').hidden=true,5000)}
function modal(title,body){lastFocus=document.activeElement;$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;if(!$('#modal').open)$('#modal').showModal()}
function close(){if($('#modal').open)$('#modal').close();if(lastFocus?.isConnected)lastFocus.focus()}
function dateForm(mode){modal(mode==='accept'?'何时提醒你？':'修改提醒时间',`<p>${mode==='accept'?'补交材料 · 截止 10 月 16 日':'提交材料 · 截止今天 18:00'}</p><label class="form-label" for="remind-at">提醒时间</label><input class="input" id="remind-at" type="datetime-local" required value="${mode==='accept'?'2026-10-15T09:00':'2026-10-10T10:00'}"><p class="inline-note">演示时区：America/Los_Angeles。修改提醒不会改变截止时间。</p>${action(mode==='accept'?'confirm-accept':'save-time','保存提醒','primary')}`)}
function formatDate(v){if(!v)return '';const [d,t]=v.split('T');const [,m,day]=d.split('-');return `${Number(m)} 月 ${Number(day)} 日 ${t}`}
function saveNew(title,when,text){if(!state.created.some(t=>t.title===title&&t.when===when))state.created.push({title,when});state.chatSent=true;state.chatResult=text;state.chatTime=when;state.scene='chat';render();$('#chat-text').value='';$('#screen').scrollTop=$('#screen').scrollHeight;toast('演示提醒已安排')}
function handle(act){if(scenes.some(s=>s[0]===act)){go(act);return}switch(act){case'complete':state.done=true;render();toast('提交材料已完成','undo');break;case'undo':state.done=false;render();toast('已恢复为未完成');break;case'snooze':modal('稍后提醒',`<p>只调整提醒时间，截止时间仍是今天 18:00。</p>${action('snooze30','30 分钟后 · 今天 10:30','setting-option')}${action('snooze60','1 小时后 · 今天 11:00','setting-option')}${action('edit','选择时间…','setting-option')}<p class="inline-note">此流程以演示通知时间 10:00 为基准。</p>`);break;case'snooze30':case'push-snooze':case'snooze60':state.time=act==='snooze60'?'今天 11:00':'今天 10:30';close();render();toast(state.scene==='offline'?'本机提醒已更新 · 待同步':'提醒时间已更新');break;case'edit':dateForm('edit');break;case'save-time':{const v=$('#remind-at').value;if(!v){$('#remind-at').reportValidity();return}state.time=formatDate(v);close();render();toast('提醒时间已更新');break}case'accept':dateForm('accept');break;case'confirm-accept':{const v=$('#remind-at').value;if(!v)return;state.suggestion='accepted';state.created.push({title:'补交材料',when:formatDate(v)});close();go('home');toast('已设为提醒','undo-accept');break}case'undo-accept':state.created=state.created.filter(t=>t.title!=='补交材料');state.suggestion='pending';render();toast('已恢复为待确认建议');break;case'dismiss':state.suggestion='dismissed';go('home');toast('建议已收起','restore-suggestion');break;case'restore-suggestion':state.created=state.created.filter(t=>t.title!=='补交材料');state.suggestion='pending';render();toast('已恢复建议');break;case'source':modal('来源依据','<p>林老师 · 10 月 9 日 16:20</p><div class="source"><small>关于申请材料的补充说明</small><p>请在下周五（10 月 16 日）前补交附件中的两份材料。</p></div><p>日期来自邮件原文；是否与你有关、何时提醒，由你确认。这是虚构的演示邮件。</p>');break;case'location':if(state.locationTime){modal('带上移动硬盘',`<p>${esc(state.locationTime)} · 本机提醒已安排</p><p>已由地点提醒改为时间提醒。</p>`);break}modal('带上移动硬盘',`<span class="tag">地点提醒</span><p>离开家附近时提醒。系统检测可能延迟，无法保证在跨出家门前触发。</p><div class="source">来自你的交代：<br>“下次出门提醒我带硬盘。”</div>${action('location-time','改用时间提醒','secondary')}`);break;case'location-time':modal('改用时间提醒','<label class="form-label" for="location-date">出发时间</label><input class="input" id="location-date" type="datetime-local" required value="2026-10-11T08:00">'+action('save-location','保存','primary'));break;case'save-location':{const when=formatDate($('#location-date').value);if(!when)return;state.locationTime=when;close();go('home');toast('已改为时间提醒 · 演示');break}case'camera':modal('给相机充电','<p>今天 20:00 · 本机提醒已安排</p><div class="source">来自你确认的提醒。<br>这是一条独立的时间事项。</div>');break;case'created':modal('新增事项',state.created.length?state.created.map(t=>`<div class="source"><strong>${esc(t.title)}</strong><p>${esc(t.when)} · 已设提醒</p></div>`).join(''):'<p>还没有新增事项，可以在交代页试一试。</p>');break;case'all':modal('全部事项',`<div class="source">提交材料 · ${state.done?'已完成':esc(state.time)}</div><div class="source">带上移动硬盘 · ${esc(state.locationTime||'离开家附近时')}</div><div class="source">给相机充电 · 今天 20:00</div>${state.created.map(t=>`<div class="source">${esc(t.title)} · ${esc(t.when)}</div>`).join('')}`);break;case'sample':$('#chat-text').value='明天九点提醒我给绿植浇水';$('#chat-text').focus();break;case'memory':modal('个人记忆',`<div class="source"><strong>家</strong><p>你确认的重要地点。精确地址仅保存在你的个人环境中。</p></div>${state.memory?`<div class="source"><strong>晚上少一点打扰</strong><p>你在 10 月 8 日确认的偏好。</p>${action('forget','忘记这条偏好','text-button danger')}</div>`:''}<p>删除记忆不会取消你已明确设置的提醒。</p>`);break;case'forget':state.memory=false;close();render();toast('已忘记这条偏好 · 演示','undo-memory');break;case'undo-memory':state.memory=true;render();toast('偏好已恢复');break;case'mail':modal('信息来源',state.mail?`<p>hello@example.com · 演示账户</p><p>只读邮件，用于发现可能遗漏的事项。最近同步：今天 09:38。</p>${action('disconnect','停止读取邮箱','secondary')}<p class="inline-note">停止读取后，已确认的任务仍保留。删除历史数据是独立操作。</p>`:`<p>尚未连接邮箱。基础时间提醒可以正常使用。</p>${action('reconnect','演示重新连接','primary')}`);break;case'disconnect':state.mail=false;close();render();toast('已停止读取邮箱 · 演示');break;case'reconnect':state.mail=true;close();render();toast('邮箱已重新连接 · 演示');break;case'quiet':modal('安静时段',`<p>AI 建议在这段时间保持安静。明确交代的提醒会单独确认。</p><label class="form-label">开始<input class="input" id="quiet-start" type="time" value="22:00"></label><label class="form-label">结束<input class="input" id="quiet-end" type="time" value="08:00"></label>${action('save-quiet','保存','primary')}`);break;case'save-quiet':state.quiet=$('#quiet-start').value+'–'+$('#quiet-end').value;close();render();toast('安静时段已更新');break;case'frequency':modal('建议频率',`${action('daily','每天一次','setting-option')}${action('app-only','仅在应用内显示','setting-option')}<p>只影响 Haiji 发现的建议，不改变你明确交代的提醒。</p>`);break;case'daily':case'app-only':state.frequency=act==='daily'?'每天一次':'仅应用内';close();render();toast('建议频率已更新');break;case'privacy':state.preview=!state.preview;render();toast(state.preview?'锁屏显示详情已开启':'锁屏详情已隐藏');break;case'environment':modal('我的环境','<p>个人环境 · 连接正常</p><div class="source">https://haiji.example.com<br>演示时区：America/Los_Angeles<br>服务状态：正常</div><p>此处为设计样例。真实版本会展示模型提供方、数据去向和最近同步状态。</p>');break;case'data':modal('导出与删除',`${action('export','导出演示数据','setting-option')}${action('delete-info','删除范围说明','setting-option danger')}<p>正式产品导出包括事项、记忆和来源引用，不包含登录凭据。</p>`);break;case'export':{const url=URL.createObjectURL(new Blob([JSON.stringify({demo:true,tasks:[{title:'提交材料',time:state.time,done:state.done},...state.created],memory:state.memory},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='haiji-demo-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);close();toast('已导出演示数据');break}case'delete-info':modal('删除范围','<p>正式版本会让你分别选择删除对话、记忆、邮箱衍生数据，或整个个人环境，并说明备份保留期限。</p><p>本原型只展示这一步的说明，没有连接数据库。</p>');break;case'pair':{const addr=$('#server').value;let url;try{url=new URL(addr)}catch{toast('请输入有效的 HTTPS 地址');return}if(url.protocol!=='https:'||!$('#pair-code').value.trim()){toast('需要 HTTPS 地址和配对码');return}modal('确认连接环境',`<p>你即将连接：</p><div class="source">${esc(url.origin)}</div><p>事项保存在该环境。模型的数据去向由服务配置决定。</p>${action('paired','确认并继续演示','primary')}`);break}case'paired':state.connected=true;close();go('chat');toast('连接成功 · 演示');break;case'retry':toast('演示环境仍离线，本机提醒保留');break;case'unlock':go('detail');toast('已模拟解锁，查看当前事项');break;case'manual-save':{const title=$('#manual-title').value.trim(),v=$('#manual-time').value;if(!title||!v)return;const text=$('#manual-title').dataset.original;close();saveNew(title,formatDate(v),text);break}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-scene],[data-action]');if(b){if(b.dataset.scene)go(b.dataset.scene);else handle(b.dataset.action)}});$('#close-modal').addEventListener('click',close);$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});$('#theme').onclick=()=>{const yes=document.body.classList.toggle('dark');$('#theme').setAttribute('aria-pressed',yes);$('#theme').textContent=yes?'浅色':'深色'};$('#large').onclick=()=>{const yes=document.body.classList.toggle('big');$('#large').setAttribute('aria-pressed',yes)};$('#preview').onchange=e=>{state.preview=e.target.checked;renderPush();if(state.scene==='settings')render()};$('#chat-form').addEventListener('submit',e=>{e.preventDefault();const v=$('#chat-text').value.trim();if(!v)return;if(/明天.*(九|9).*浇水/.test(v)){saveNew('给绿植浇水','10 月 11 日 09:00',v)}else{modal('手动确认这件事',`<p>原型未连接真实 AI。请确认标题与时间，完成相同的创建流程。</p><label class="form-label" for="manual-title">事项</label><input class="input" id="manual-title" value="${esc(v)}" data-original="${esc(v)}"><label class="form-label" for="manual-time">提醒时间</label><input class="input" id="manual-time" type="datetime-local" required value="2026-10-11T09:00">${action('manual-save','确认提醒','primary')}`)}});$('#chat-text').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#chat-form').requestSubmit()}});render();
</script></body></html>
